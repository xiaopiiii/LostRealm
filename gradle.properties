#         ② 技能名里的「(主动)」「(Active, Toggleable)」后缀全部摘掉 ——
#            此前 tooltip 又加了一次 [主动] 前缀，同一行出现两次「主动」。
#            类型标记统一由 ItemMedal 按 isActive()/isToggleable() 给出。
#         ③ 节点技能默认只列名字；按住 Shift 才在每行下方展开具体效果，
#            末尾附「按住 Shift 查看技能详情」提示。
#   dv37 — 【药水无限续杯门槛改为「满 16 瓶」】+【HUD 覆盖层泄漏修复】
#         ① PotionInfiniteHandler：判定由「背包里有该药水(>=1 瓶)」改为
#            「**同效药水总瓶数 >= 16**」—— 可跨多个堆叠累加（8+8 也算），
#            跌破 16 立即失去。门槛取自 STACK_POTION_MAX，
#            因此依赖「药水堆叠 16」开关处于开启状态。
#         ② EffectHudEditorScreen.onClose()：按 Esc 退出时统一丢弃未提交的覆盖。
#            覆盖层是一组静态变量且渲染器优先读它 —— 此前只要在该界面里
#            点过任意一档（例如把倒计时点成「×」）再按 Esc 退出，那个值就会
#            永久粘住，之后在正式配置界面里怎么改都「看起来不生效」。
#   dv36 — 【配置界面两大体验问题 + HUD 图标消失】
#         ① effect_hud_scale 由 switchOpt(25,100) 改为 step —— 前者按「枚举」
#            语义会把 25~100 每个整数各渲染成一个按钮（共 76 个），横排铺满
#            整屏并溢出到侧边栏外，且语言文件只配了 4 档、其余退化成原始键名
#            （玩家看到一排 “.lost_realm”）。另给 switchOpt 加「取值 <= 8」
#            断言，杜绝同类误用复发。
#         ② EffectHudRenderer：图标 blit 坐标修正 —— 坐标系已平移到格子位置，
#            却又传了一次绝对坐标，等于偏移两遍，贴右上/右下角时图标被推出
#            屏幕（表现为「底框还在、图标没了」）；底框同时改为跟随缩放，
#            否则 50% 以下相邻格子会糊成一团。
#         ③ 数值控件去掉相距 100px 的 −/+，改为可直接输入的文本框；新增
#            81 条 .unit 语言键把单位画到数值右侧，名称里的「(%)」「(秒)」
#            「(级)」一并摘除。
#   dv6 — 修复两个致命问题(使模组首次真正可加载):
#         ① mods.toml 的 version 由 "dv5" 改为合法的 "1.0.0" —— 此前 Forge 抛
#            InvalidModFileException: Illegal version number specified dv5,
#            整个模组被判为"不是有效的Mod文件"(dv1~dv5 全体受影响);
#            同时把 mod_version(内部,固定 1.0.0)与 mod_build(文件名, dvN)拆开。
#         ② EffectHudMixin 删除三个 @Shadow 字段(minecraft/screenWidth/screenHeight)
#            改用 Minecraft.getInstance() + getWindow().getGuiScaled*() ——
#            此前 refmap 未生成字段映射,导致启动期 FATAL 崩溃。
#         另:新增交付自检项「refmap 每条值须含 m_/f_ 前缀」。
#   dv5 — 遗落之主(改造终局 Boss):Boss 更名「遗落之主」,竞技场升级为
#         程序化建造的「遗落之都」(半径100,城墙/列柱/三层台地/八塔/火盆),
#         召唤符删除 -> 并入门钥匙配方;新增零阶段对话(打字机 UI + 离开/决斗),
#         幽灵试炼(极速木剑冲脸 + 强制50%最大生命 + 消失)、五波清场(可配置)、
#         三战斗形态 + 2 次锁血回满 + 体型/描边配色/血条显隐,四相祭坛移除机制
#         降级为装饰,配置界面新增 6 项可调(决斗/波次/形态转换)
mod_id=lost_realm
mod_name=Lost Realm

# ⚠️ 内部版本号:Forge 按 Maven 规范校验,必须数字开头,dv5 之类会被拒绝加载。
#    固定为 1.0.0,除非真正发版,否则永不改动。
mod_version=1.0.0

# ⚠️ 构建标签:仅用于拼 jar 文件名(Lost Realm-dv16.jar),给人看用。
#    【每次改动内容都必须把末尾数字 +1】,否则无法区分哪个 jar 是哪个版本。
mod_build=beta33
mod_group=com.lost_realm
mod_authors=Lost Realm Team
mod_description=五枚勋章(射手/战士/坦克/法师/召唤师)熟练度进阶系统,并附带一整套体验改进(QoL)增强。硬性前置仅 Curios;法师与召唤师勋章以诡厄巫法 Goety 为底座(可选)。

# 前置模组(编译期使用,版本以官方为准)
