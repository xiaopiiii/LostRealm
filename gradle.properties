#         直线登场时头部必须走满 96 格才能铺开身体,结束时必然停在
#         96 格外;而创造/旁观玩家不算索敌目标,转巡游后也不会回来 ——
#         永远停在那儿 = "消失"。
#         【结论】光调速度治不了:0.4 格/tick 只是把"2 秒窜没"变成
#         "12 秒慢慢飘没",最后它还是在 96 格外的天上。
#         根子在路径本身,必须换几何。
#         ① ★ 登场路径改为盘绕:头部绕着出场地转,半径 =
#            弧长/(2π) = 96/(2π) ≈ 15.28 格(圆周长正好等于身体全长),
#            于是"走满 96 格弧长"≈"盘完一整圈"。
#            实测:12 秒铺满,距圆心最远 15.28 格(旧版 96 格),
#            盘 1.14 圈,整体是一条不自交的螺旋。
#            顺带消掉了"创造模式看不见"这个测试痛点 —— 盘绕只依赖出场地。
#         ② 速度按玩家指定:EMERGE_SPEED 0.5(起手) / EMERGE_MIN_SPEED 0.4(主体)。
#            ⚠️ 换算关系:时长(秒) = 96 ÷ (主体速度 × 20)。
#            所以 0.4 对应 12 秒,不是 8 秒(8 秒要取 0.6)。
#         ③ 新增 EMERGE_MIN_TURN_RADIUS = 3.0:半径太小就转圈的话,
#            身体每 2.4 格一节会折成疙瘩(实测相邻节最大转角 90°)。
#            3.0 压到 56°,圈数同时从 1.44 收敛到 1.14。
#         ④ ⚠️ 两个在离线模拟里抓到的坑(都已修,记下来免得写回去):
#            a) 半径若按"已走弧长"推进会**自锁**:起点弧长 0 → 目标半径 0
#               → 位移 0 → 弧长永远 0,整场开场卡死在圆心。
#               改为按 tick 推进。
#            b) 角度若每 tick 从坐标反算,atan2 值域只有 ±180°,
#               转过半圈就翻转、把累积值打回去(实测"绕了两圈只记下 155°")。
#               改为把角度存成状态自己累加。
#         【验证方式】改完后先写了一份离线数值模拟(复刻 tickEmerge 的每 tick
#         逻辑),跑 240 步看弧长/半径/圈数/相邻节转角是否收敛,再动手编译。
#         这一版的两个致命 bug 都是这么提前抓出来的 —— 光靠读代码看不出来。
