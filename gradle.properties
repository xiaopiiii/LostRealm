# 模组信息
# 注册名(mod_id)为 lost_realm,固定不变(改它会导致旧存档与配置失效)。
# 玩家可见名称(Lost Realm)与版本号在此调整。
#
# ⚠️ 版本号规则(务必遵守):【每次改动内容都必须把 mod_build 末尾数字 +1】。
#    只放行"只改注释/不改行为"的例外,其余一律递增。
#    dv1 -> dv2 -> dv3 ... 否则无法区分哪个 jar 是哪个版本。
#
#    ⚠️ 两个字段的分工(beta1 起):
#      mod_version = 1.0.0   → **主版本基底**,通常不动。它的唯一职责是
#                              保证拼出来的字符串以数字开头。
#      mod_build   = beta1   → β 版序号,每次改动 +1(beta1 → beta2 → …)。
#                              它同时驱动**两处**:mods.toml 的 version
#                              与 jar 文件名。
#
#      拼接在 build.gradle 里,结果两处完全一致:
#          mods.toml  version = "1.0.0-beta1"  → 模组列表显示「Lost Realm 1.0.0-beta1」
#          jar 文件名          = "Lost Realm-1.0.0-beta1.jar"
#
#    历史事故:dv1~dv4 曾把 "dvN" 直接当 mods.toml 的 version,导致 Forge 抛
#    InvalidModFileException: Illegal version number specified dv2,
#    所有 jar 在正式环境都无法加载。踩坑的原因是 **字母开头**,
#    而不是"含字母" —— Forge 的校验正则是 ^\d+.*(fmlloader 的
#    ModInfo.VALID_VERSION),只要求数字开头,后面接什么都不管。
#
