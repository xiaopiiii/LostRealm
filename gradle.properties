#   beta6 — 【★ 厄瑞玻斯第一次真的能被召唤出来(修两个"根本没跑起来"的 bug)】:
#         起因:玩家反馈「/summon 报无法召唤实体」。为此在本地搭了一个
#         Forge 生产服务端做实测 —— 一测就发现 beta3~beta5 的厄瑞玻斯
#         **从来没能被召唤出来过**,而且全程没有任何报错提示。
#         ① 【致命】ErebosBoss.defineSynchedData() 漏了 super.defineSynchedData()。
#            原版 LivingEntity 在这个方法里注册 DATA_HEALTH_ID 等同步槽,
#            漏掉之后它的构造函数里 setHealth() 找不到槽位直接 NPE;
#            而这个异常被 EntityType.loadEntity 静默吞掉,
#            玩家只看到一句「无法召唤实体」,日志里也只是一行 WARN。
#            ⚠️ 反直觉之处:Entity.defineSynchedData() 是**抽象方法** ——
#              直接继承 Entity / Projectile 的类(ErebosPart / ErebosBolt /
#              ErebosEffect)**不能**调 super,只有 Monster 这条链必须调。
#              两种写法之间的差别,编译期完全看不出来。
#         ② 【致命但无声】Boss 血量被砍到 1024。原版「最大生命」是 RangedAttribute,
#            上限写死 1024,AttributeInstance.calculateValue() 最后会 sanitizeValue()
#            硬夹。于是设计的 24000 血**静默**变成 1024 —— 不是"肉度调得不对",
#            是"调多少都没用"。新增 AttributeLimits:在 mod 构造阶段用反射
#            (按「类型 + 值」定位字段,避开 SRG/MCP 命名差异)把上限抬到 1000000。
#            🩹 顺带修好 Warden 的同类隐患(它的配置范围上限 10000 也超 1024)。
#         ③ 碰撞部件被移除后不会重建。ensureParts 只在 parts == null 时建立,
#            部件若被外部移除(指令/其它模组),那一段身体从此砍不中,
#            而 Boss 看上去依旧完整。改为逐 tick 检查失效即补。
#         ④ 无目标时开场钻出会卡死。玩家若在召唤后立刻走开,Boss 会永远停在
#            EMERGE —— 而 EMERGE 期间是**无敌**的,等于场上多个打不动的摆设。
#            现在无目标也能自己走出来。
#
