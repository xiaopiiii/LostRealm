#   beta9 — 【★ 厄瑞玻斯"召唤后消失"的真正根因:客户端渲染器坐标系错位】:
#         玩家提供了 beta6 的完整日志 —— 服务端侧一切正常(召唤成功、无异常、
#         无移除记录、血条在),于是把怀疑面收窄到"客户端这一帧到底画在哪"。
#         ① ★ 根因:client/boss/ErebosRenderer#render 把体节摆到了
#            「体节 − 摄像机」，而 EntityRenderDispatcher 在调用本渲染器
#            **之前**就已经 pushPose + translate 到了「本体位置」。
#            于是实际画在 (本体−摄像机) + (体节−摄像机) = **两倍距离外**。
#            症状:召唤瞬间本体≈摄像机、误差≈0 → 看得见;
#            EMERGE 让头以 3.2 格/tick 背对玩家飞出 96 格 → 误差线性放大
#            → 整条虫被画到屏幕上根本不存在的位置 → "过几秒消失"。
#            修法:改为 translate(体节 − 本体)，插值基准与 LevelRenderer 对齐
#            (Mth.lerp(partialTick, entity.xOld, entity.getX()))。
#            确认手段:javap -c 反编译 EntityRenderDispatcher#render，
#            字节码里 pushPose → translate(DDD) → 调 EntityRenderer.render
#            的顺序一目了然。旁证:同包的 ErebosBoltRenderer 从不 translate
#            世界坐标(写法是对的)。
#            ⚠️ beta8 的剔除盒兜底本身没错(第一帧确实是零体积盒)，
#            但它不是这个现象的原因,保留。
#         ② 修 summoner_medal 缺模型 —— beta6 日志里的
#            "Unable to load model: 'lost_realm:summoner_medal#inventory'"
#            就是"召唤师勋章显示成紫黑格"的根因(贴图在、模型 json 漏了)。
#            补 models/item/summoner_medal.json;顺手核对了全部 25 个注册物品,
#            模型 0 缺失。
#         ③ 排查结论:全项目只有 ErebosRenderer 一处用到了 camera.getPosition()，
#            其余 translate 都是 UI/模型空间,已全数核对。
#         ④ 测试提示:创造/旁观玩家不算 Boss 目标(见 aiStep 索敌)，
#            所以创造模式下 EMERGE 结束后虫子会停在原地不追人 ——
#            要在生存/冒险模式下测才能看到完整行为。
#   beta8 — 【厄瑞玻斯"客户端不渲染"的决定性诊断 + 剔除盒兜底】:
#         玩家实测补充了关键信息:召唤后看不见虫,但**再次右键召唤物会提示
#         "已经在此地了"** —— 证明 isAlive() && !isRemoved() 为真,实体在服务端
#         活得好好的。所以不是被清除,是**客户端不画了**。
#         ① 反编译定位到原版的判据:LivingEntity.tick() 里是
#               if (!isRemoved()) { aiStep(); }
#            —— 实体一旦被标记移除,aiStep 就永远不再调用,客户端的体节数据
#            随之冻结、整条虫不再渲染。而 setRemoved() 是 final 覆写不了,
#            所以改为在 aiStep 被跳过时打印(带 CLIENT/SERVER 与移除原因)。
#            这一行出现与否,就能一刀切开"客户端实体被移除"与"渲染被剔除"。
#         ② 修一个真实缺陷:getBoundingBoxForCulling() 单独返回体节算出的剔除盒,
#            而那几个字段初始为 0 —— 在第一次 advanceTrail 之前会返回
#            "原点处的零体积盒",玩家不站在原点附近时整条虫被视锥剔除。
#            现在把它与本体的碰撞箱求并集,保证任何时候都至少覆盖自身。
#         ③ 诊断日志覆盖:服务端前 5 tick(action/血量/坐标/轨迹长度)、
#            客户端前 5 tick(存活/移除/血量/体节)、渲染器前 3 帧(拿到的坐标)、
#            移除时(原因/时长/血量)、aiStep 被跳过时(端别/原因)。
#   beta7 — 【修召唤师勋章戴不上 + 加厄瑞玻斯诊断日志】:
#         ① ★ 召唤师勋章戴不上 —— 玩家实测反馈。根因是 Curios 的物品标签
