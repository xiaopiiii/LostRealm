#         ① 音频处理：原文件是 MP4 容器(AAC)，MC 读不了 → 转 Vorbis。
#            裁掉开头 0.258s 的静音（-45dBFS 阈值定位），否则循环时每次都要空转半秒。
#            结果 179.743s / 3.8MB / q6。
#         ② 新增 sound/ModSounds：全模组第一个自定义 SoundEvent
#            （此前所有音效都复用原版）。注册名 music.erebos_battle 带点，
#            是照抄原版 music.dragon 的写法；它同时是 sounds.json 的键，两者必须一致。
#         ③ 新增 assets/lost_realm/sounds.json + sounds/music/erebos_battle.ogg。
#            必须标 "stream": true —— 长音频不流式播放会整段解码成 PCM
#            （3.8MB ogg → 约 60MB 内存），而且 stream 才能真正循环。
#         ④ 新增 client/ErebosBattleMusic：AbstractSoundInstance 子类，
#            looping=true、relative=false（BGM 不该跟位置走）。
