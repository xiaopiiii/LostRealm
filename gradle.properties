#            后续把 volume 推上去只是在改一个不存在的声道。改成 0.01（约 -40dB，听不见）。
#         ② 星门穿越「完全是瞬移」—— 上一版把它改成了 trail.translate()（整条一起挪），
#            方向反了。设计稿原文：「头部先穿门，身体逐节跟进，尾部通过后正确结束穿门状态」。
#            恢复 push + markBreak；同时把穿门阶段从「固定 10 tick」改成「直到身体铺满」
#            （旧实现 10 tick 只走 32 格，而身体 210 格，身体根本来不及跟过去）。
#            GATE_SPEED 3.2 → 5.0，210 格约 42 tick 走完。
