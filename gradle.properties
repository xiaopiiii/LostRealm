curios_version=5.14.1
# ---- GeckoLib(实体骨骼动画引擎,必需前置,dv13 起) ----
# 注意:mods.toml 里声明的 modId 是 "geckolib"(模组自报的 id),
# 而 Maven 坐标里的 artifactId 是 geckolib-forge-1.20.1。
# 4.4.x 是 1.20.1 Forge 的稳定线(4.7+/4.8+ 主要面向 NeoForge)。
geckolib_version=4.4.9
# 可选前置:诡厄巫法 Goety(法师勋章底座),jar 放于 libs/
