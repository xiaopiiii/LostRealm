#            128 格内未移除的 ErebosBoss，有就淡入(2.3s)，没有就淡出(1.4s)后停止。
#            用 !isRemoved() 而不是 isAlive()：死亡崩解演出那 60 tick 仍在场，
#            音乐该继续，突然静音会让演出变空。
#            【为什么不做服务端事件】音乐会先于实体同步到达客户端，
