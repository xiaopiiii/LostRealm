#   beta20 — 【手感与压迫感：修抽搐/停顿 + 体型×2、身长×1.5、弹幕×3】:
#         玩家实测 beta19:渲染正常了。反馈四件事,逐条处理:
#         ① 「移动一卡一卡、会抽搐」—— 根因是<b>发包频率与插值相位不一致</b>:
#            脊线包原本每 2 tick 发一次(10Hz),而客户端渲染插值用的是 partialTick
#            (0→1 每 tick 循环一次)。于是每个包周期里有一半时间在原地等,
#            然后一次性跳过两个 tick 的位移 —— 20Hz 的位移被压成 10Hz 的脉冲。
#            改为每 tick 发包(20Hz),相位对齐。带宽 480B/tick ≈ 9.6KB/s。
#         ② 「抽搐」的第二处:渲染时算体节朝向用的是 curr(每 tick 才换一帧),
#            而渲染是 60fps —— 朝向在一帧内不动、下一帧突变,转弯时身体各节
#            "一格一格摆头"。改为用插值后的前后节坐标算切线。
#         ③ 「某个技能瞬移后,头过去了身体一节节跟过去」——
#            查 ErebosTrail.sample():撞到断点后剩余节填充位置用的是 slot(size-1),
#            即环形缓冲里【最旧】的点。正常走完时它恰好是轨迹起点,看不出问题;
#            但瞬移撞断点时,最旧点可能是上千个样本之前、几十格开外 ——
#            于是整条身体被甩到那个久远坐标上。改为堆在断点本身。
#         ④ 「弹幕太少、原版都能轻松躲」—— 全部招式弹幕数 ×3,
#            MAX_LIVE_BOLTS 120→360,MAX_BOLTS_PER_VOLLEY 24→72。
#            波数不变(只加密每波,不加长战斗)。
#         ⑤ 「体型大两倍、身长再 1.5 倍」——
#            BODY_DIAMETER 2.4→4.8,PART_SIZE 2.6→5.2,
#            SEGMENT_SPACING 2.4→3.6(总长 96→144 格)。
#            长度靠拉节距、不加节数:节数一涨,碰撞部件实体就跟着涨,
#            而这部设备最吃紧的恰恰是"实体数量 × 同步频率"。
#            登场速度等比 0.5/0.4→0.75/0.6,铺开仍是 12 秒(离线模拟 239 tick)。
#            本体碰撞箱与影子半径同步放大。
#         【待观察】360 个弹幕如果让服务端 tick 吃紧,下一步是给弹幕做
#         位置包降频 + 客户端 lerpTo 平滑(现在每个弹幕仍每 tick 同步)。
