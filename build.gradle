plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

// ============================================================
// 版本号
// ------------------------------------------------------------
// 只有一个"活"的字段:gradle.properties 里的 mod_build(beta1 / beta2 / …)。
// 它同时驱动**两处**显示,保证永远一致:
//      mods.toml 的 version   → 模组列表里的「Lost Realm 1.0.0-beta1」
//      jar 文件名             → Lost Realm-1.0.0-beta1.jar
//
// mod_version(1.0.0)只是"主版本基底",通常不动 —— 它保证拼出来的字符串
// **以数字开头**。
//
// ⚠️ 为什么必须数字开头:
//   Forge 的校验正则是 ^\d+.*(见 fmlloader 的 ModInfo.VALID_VERSION)——
//   只要求数字开头,后面接什么都不管。
//   早年 dv1~dv4 直接把 "dv2" 当版本号写进 mods.toml,结果:
//       InvalidModFileException: Illegal version number specified dv2
//   所有 jar 在正式环境都无法加载。踩坑原因是 **字母开头**,记住了。
// ============================================================
def internalVersion = "${mod_version}-${mod_build}"

version = internalVersion
group = mod_group

// 文件名带上完整版本号,与模组列表里显示的完全一致:
//     Lost Realm-1.0.0-beta1.jar
// ⚠️ 必须显式设 archiveFileName:Gradle 默认会拿 archivesBaseName 再追加
//    一次 "-${version}",不覆盖就会产出 "Lost Realm-1.0.0-beta1-1.0.0-beta1.jar"。
archivesBaseName = "Lost Realm"

tasks.named('jar', Jar).configure {
    archiveFileName = "Lost Realm-${internalVersion}.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version as String))

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Goety 相关的 Mixin 单独一份配置:Goety 是可选依赖,这份配置整体
    // "required": false + 内部 @Pseudo/require=0,缺失时安静跳过,
    // 不会因为它而让整个模组在没装 Goety 的整合包里加载失败。
    config "${mod_id}.goety.mixins.json"
    // JEI 相关的 Mixin 同理:JEI 是可选依赖,这份配置 required: false,
    // 目标类包名在 15.20 → 15.74 之间改过(overlay → overlay.ingredients),
    // 所以编译期依赖也必须钉在 15.74,见本文件 181 行附近的说明。
    config "${mod_id}.jei.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'The Illusive C4 (Curios)'
        url = 'https://maven.theillusivec4.top/'
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ---- 必需前置 ----
    // Curios API(饰品槽位)
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")
    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")

    // ---- ★ beta30：不再依赖 Apothic Attributes（attributeslib / placebo）----
    // 12 条战斗属性（暴击率 / 暴击伤害 / 吸血 / 破甲 / 闪避 / 过量治疗 /
    // 受疗加成 / 经验加成 / 火焰伤害 / 冰霜伤害 / 箭伤 / 拉弓速度）
    // 已由本模组自行注册（attribute/RealmAttributes），效果在
    // attribute/RealmAttributeEffects + mixin/LivingEntityArmorPierceMixin 里实现。
    // 数值量纲与原 attributeslib 1.3.7 逐条对齐，老存档的修饰符不受影响。
    //
    // ⚠️ 不要把这两个依赖加回来：加回来会变成「两套同名属性同时生效」，
    //    玩家的暴击率会被算两遍。

    // 配置屏幕模组 Configured(可选依赖)。
    // 本模组对 Configured 的接入完全通过字符串反射完成(见 client/MedalsClient.java),
    // 因此不需要编译期依赖,避免 CurseMaven 可用性影响构建。
    // 若需在开发环境测试配置屏幕,请手动放入 libs/ 并启用下面两行:
    // compileOnly fg.deobf("curse.maven:configured-457570:518090")
    // runtimeOnly fg.deobf("curse.maven:configured-457570:518090")

    // ---- 可选前置:诡厄巫法 Goety(法师勋章底座) ----
    // 法师勋章通过 Goety 的官方公开 API 实现(SEHelper / ModAttributes / IOwned / IWand)。
    // 未安装 Goety 时,法师勋章会被 GoetyCompat 软禁用,其余勋章正常工作。
    //
    // ⚠️ 前置 jar **不随源码分发**(避免二次分发,违反 CurseForge/Modrinth 的分发条款)。
    //    首次编译前请自行下载,放进 libs/(文件名前缀匹配 goety-*.jar 即可):
    //      CurseForge  https://www.curseforge.com/minecraft/mc-mods/goety/files
    //      Modrinth    https://modrinth.com/mod/goety
    //      需要版本    2.5.58.4(Minecraft 1.20.1 / Forge)
    //
    // 注意:必须通过 files() + fg.deobf() 引入,不能写成 flatDir 坐标
    //      —— flatDir 不触发 deobf,类名/方法名会对不上。
    def goetyJars = fileTree(dir: 'libs', include: ['goety-*.jar']).files
    if (goetyJars.isEmpty()) {
        throw new GradleException("""
            |============================================================
            |缺少前置模组 Goety(诡厄巫法),无法编译。
            |  需要版本: 2.5.58.4  (Minecraft 1.20.1 / Forge)
            |  下载地址: https://www.curseforge.com/minecraft/mc-mods/goety/files
            |            https://modrinth.com/mod/goety
            |  放置位置: ${projectDir}/libs/goety-2.5.58.4.jar
            |  说明: 前置模组不随源码分发,请自行下载后放入 libs/。
            |============================================================
            |""".stripMargin())
    }
    goetyJars.each { jar ->
        compileOnly fg.deobf(files(jar))
        runtimeOnly fg.deobf(files(jar))
    }

    // ---- 必需前置:GeckoLib(实体骨骼动画引擎,dv13 起) ----
    // 用于遗落之主的三形态造型(Boss 换阶段的触手 / 骨刺 / 翅膀骨架动画)。
    // 原版渲染管线不消费 Entity#getScale(),几何放样只能靠 HumanoidModel 固定骨骼
    // (仅 7 根:head/hat/body/左右臂/左右腿),无法表达触手一类造型,故引入 GeckoLib。
    //
    // ⚠️ 同样不随源码分发,请自行下载放入 libs/(前缀匹配 geckolib-*.jar):
    //      CurseForge  https://www.curseforge.com/minecraft/mc-mods/geckolib/files
    //      Modrinth    https://modrinth.com/mod/geckolib
    //      需要版本    4.4.9(4.4.x 是 1.20.1 Forge 稳定线;4.7+/4.8+ 面向 NeoForge)
    //    Maven 坐标(若想改回在线依赖): software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9
    def geckolibJars = fileTree(dir: 'libs', include: ['geckolib-*.jar']).files
    if (geckolibJars.isEmpty()) {
        throw new GradleException("""
            |============================================================
            |缺少前置模组 GeckoLib,无法编译。
            |  需要版本: 4.4.9  (Minecraft 1.20.1 / Forge)
            |  下载地址: https://www.curseforge.com/minecraft/mc-mods/geckolib/files
            |            https://modrinth.com/mod/geckolib
            |  放置位置: ${projectDir}/libs/geckolib-forge-1.20.1-4.4.9.jar
            |  说明: 前置模组不随源码分发,请自行下载后放入 libs/。
            |============================================================
            |""".stripMargin())
    }
    geckolibJars.each { jar ->
        compileOnly fg.deobf(files(jar))
        runtimeOnly fg.deobf(files(jar))
    }

    // ---- 可选:JEI(仅编译期,用于把彩蛋物品从 JEI 的物品列表里摘掉) ----
    // 运行时完全可选:没装 JEI 时没人扫描 @JeiPlugin,插件类不会被加载。
    // 只做 compileOnly,不打包、不要求玩家安装。
    // 坐标来自 https://maven.blamejared.com/mezz/jei/jei-1.20.1-forge/
    // ⚠️ 必须与运行时版本一致:mixin 的目标类包名在 15.20 → 15.74 之间改过
    //    (mezz.jei.gui.overlay.IngredientListRenderer
    //     → mezz.jei.gui.overlay.ingredients.IngredientListRenderer)。
    //    编译期用旧版本会写出指向不存在类名的 mixin,启动即崩。
    //    离线环境取不到新 maven 包,所以直接把运行时 jar 放进 libs/ 编译。
    compileOnly fg.deobf(files('libs/jei-1.20.1-forge-15.74.0.233.jar'))

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 若 maven.theillusivec4.top 不可用,可把前置 jar 放入 libs/ 目录并使用本地依赖:
//   compileOnly fg.deobf("blank:curios-forge-${curios_version}+${minecraft_version}")
//   runtimeOnly fg.deobf("blank:curios-forge-${curios_version}+${minecraft_version}")

tasks.named('processResources', ProcessResources).configure {
    // mods.toml / pack.mcmeta 均为 UTF-8 编码
    filteringCharset = 'UTF-8'

    // ---- 中文属性修复(重要) ----
    // Java 的 Properties(以及 Gradle 读取 gradle.properties)默认按 ISO-8859-1 解码,
    // 因此 gradle.properties 里的中文(如 mod_name=遗落境)会被读成乱码(é\x81\x97...)，
    // 注入 mods.toml 后即成为双重编码乱码。
    // 这里把已按 Latin-1 误读的字符串"按字节还原",再用 UTF-8 重新解码,即可得到正确中文。
    def fixUtf8 = { String s -> s == null ? null : new String(s.getBytes('ISO-8859-1'), 'UTF-8') }

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: '[1.20.1,1.20.2)',
            forge_version: forge_version, forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: mod_id, mod_license: 'MIT', mod_version: internalVersion,
            mod_name: fixUtf8(mod_name),
            mod_authors: fixUtf8(mod_authors),
            mod_description: fixUtf8(mod_description),
            curios_version: curios_version,
            geckolib_version: geckolib_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------
// 保证 Mixin refmap 一定被生成并打进 jar
// ---------------------------------------------------------------
// Mixin 的注解处理器会产出 lost_realm.refmap.json(MCP 名 -> SRG 名 的映射),
// 运行时被 Mixin 用来解析 @Inject 的目标方法。
// 问题:Gradle 的增量编译判断「源码没变」时会整个跳过注解处理,
//       于是 refmap 不会重新生成 —— 若 build 目录恰好是干净的,
//       jar 里就会缺少 refmap,Mixin 在运行时找不到目标方法而静默失效。
// 解法:把 refmap 声明为 compileJava 的产物(declared output),
//       一旦它缺失,Gradle 即视为输出过期并重新执行注解处理。
//       打包本身由 MixinGradle 的 addMixinsToJar 负责,这里不需要再手动 from。
final def refmapFile = layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json")
tasks.named('compileJava').configure {
    outputs.file(refmapFile)
}
